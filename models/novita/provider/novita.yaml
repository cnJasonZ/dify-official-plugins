provider: novita
label:
  en_US: Novita AI
description:
  en_US: An LLM API that matches various application scenarios with high cost-effectiveness.
  zh_Hans: 适配多种海外应用场景的高性价比 LLM API
icon_small:
  en_US: icon_s_en.svg
icon_large:
  en_US: icon_l_en.svg
background: "#c7fce2"
help:
  title:
    en_US: Get your API key from Novita AI
    zh_Hans: 从 Novita AI 获取 API Key
  url:
    en_US: https://novita.ai/settings/key-management?utm_source=dify&utm_medium=ch&utm_campaign=api
supported_model_types:
  - llm
  - text-embedding
configurate_methods:
  - predefined-model
extra:
  python:
    model_sources:
      - models/llm/llm.py
    provider_source: provider/novita.py
models:
  llm:
    position: models/llm/_position.yaml
    predefined:
      - models/llm/*.yaml
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      placeholder:
        en_US: Enter your API Key
        zh_Hans: 在此输入您的 API Key
      required: true
      type: secret-input
      

